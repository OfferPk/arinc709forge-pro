<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#07090e; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Top Navigation Bar -->
  <rect x="20" y="15" width="960" height="50" rx="6" fill="#0f141e" stroke="#1e293b"/>
  <text x="40" y="46" fill="#06b6d4" font-size="18" font-weight="700">ARINC709Forge Pro (v1.0.0) — Mark 5 DME &amp; DME/DME RNAV Station</text>
  <rect x="760" y="26" width="200" height="28" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981"/>
  <text x="775" y="45" fill="#10b981" font-size="11" font-weight="700">TSO-C66c / DO-189 PASS</text>

  <!-- Cockpit Bezel Left Panel -->
  <rect x="20" y="80" width="350" height="500" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  <rect x="40" y="105" width="310" height="160" rx="6" fill="#18202c" stroke="#334155"/>
  <rect x="55" y="125" width="280" height="90" rx="4" fill="#020617" stroke="#0f172a"/>
  <text x="135" y="175" fill="#22d3ee" font-family="'SF Mono', monospace" font-size="44" font-weight="900" letter-spacing="2">42.89</text>
  <text x="250" y="175" fill="#94a3b8" font-size="16">NM</text>
  <text x="75" y="200" fill="#34d399" font-family="'SF Mono', monospace" font-size="14" font-weight="700">GS: 450 KT  ·  TTS: 5.7 MIN</text>
  <text x="75" y="245" fill="#fbbf24" font-size="11">DXB · CH 74X (115.30 MHz) · MORSE: -.. -..- -...</text>

  <!-- Controls Knobs & Selectors -->
  <rect x="40" y="280" width="145" height="40" rx="4" fill="#1e293b" stroke="#06b6d4"/>
  <text x="60" y="305" fill="#f8fafc" font-size="12" font-weight="700">DME 1 (CAPT)</text>

  <rect x="205" y="280" width="145" height="40" rx="4" fill="#18202c" stroke="#334155"/>
  <text x="225" y="305" fill="#94a3b8" font-size="12" font-weight="700">DME 2 (F/O)</text>

  <rect x="40" y="335" width="310" height="40" rx="4" fill="#18202c" stroke="#334155"/>
  <text x="55" y="360" fill="#06b6d4" font-size="12" font-weight="700">MODE: TRACK (PRF 25 PPS)</text>

  <!-- Presets & Memory Hold -->
  <rect x="40" y="390" width="95" height="35" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="55" y="412" fill="#f8fafc" font-size="11" font-weight="600">DXB (115.3)</text>

  <rect x="145" y="390" width="95" height="35" rx="4" fill="#1e293b" stroke="#334155"/>
  <text x="155" y="412" fill="#f8fafc" font-size="11" font-weight="600">LHR (113.6)</text>

  <rect x="250" y="390" width="100" height="35" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b"/>
  <text x="260" y="412" fill="#fbbf24" font-size="11" font-weight="700">MEMORY (10s)</text>

  <rect x="40" y="440" width="310" height="120" rx="6" fill="#18202c" stroke="#334155"/>
  <text x="55" y="465" fill="#38bdf8" font-size="11" font-weight="700">FLIGHT GEOMETRY PARAMETERS</text>
  <text x="55" y="490" fill="#cbd5e1" font-size="11">Ground Distance: 42.5 NM</text>
  <text x="55" y="510" fill="#cbd5e1" font-size="11">Aircraft Altitude: 35,000 ft (FL350)</text>
  <text x="55" y="530" fill="#cbd5e1" font-size="11">Round-Trip Time: 580.05 µs (50 µs delay + 530 µs)</text>
  <text x="55" y="550" fill="#34d399" font-size="11">DME/DME Multi-Lateration Quality: RNP 0.1 PASS</text>

  <!-- Right: Multi-Channel Scanning Table & 10-Point Auditor -->
  <rect x="390" y="80" width="590" height="235" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  <text x="410" y="110" fill="#06b6d4" font-size="13" font-weight="700">MULTI-CHANNEL SCANNING DME (DME/DME RNAV)</text>
  
  <rect x="410" y="125" width="550" height="28" fill="rgba(255,255,255,0.03)"/>
  <text x="420" y="144" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">#1 ONSIDE DISPLAY   DXB (115.30 MHz)  42.89 NM  450 KT  TRACK</text>

  <rect x="410" y="155" width="550" height="28" fill="transparent"/>
  <text x="420" y="174" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">#2 FMS RNAV AUTO 1  SHJ (113.60 MHz)  49.32 NM  450 KT  TRACK</text>

  <rect x="410" y="185" width="550" height="28" fill="rgba(255,255,255,0.03)"/>
  <text x="420" y="204" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">#3 FMS RNAV AUTO 2  ALN (117.10 MHz)  56.61 NM  450 KT  TRACK</text>

  <rect x="410" y="215" width="550" height="28" fill="transparent"/>
  <text x="420" y="234" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">#4 FMS RNAV AUTO 3  FUJ (114.90 MHz)  63.48 NM  450 KT  TRACK</text>

  <rect x="410" y="245" width="550" height="28" fill="rgba(255,255,255,0.03)"/>
  <text x="420" y="264" fill="#38bdf8" font-size="11" font-family="'SF Mono', monospace">#5 FMS RNAV AUTO 4  RAK (112.40 MHz)  70.77 NM  450 KT  TRACK</text>

  <!-- Right Bottom: 10-Point Normative Auditor -->
  <rect x="390" y="335" width="590" height="245" rx="8" fill="#0f141e" stroke="#1e293b" filter="url(#shadow2)"/>
  <text x="410" y="365" fill="#10b981" font-size="13" font-weight="700">10-POINT NORMATIVE AUDITOR (10/10 PASSED - 100%)</text>

  <text x="410" y="395" fill="#cbd5e1" font-size="11">[PASSED] A709_01: Dual Independent DME Interrogator Architecture (SDI 1/2)</text>
  <text x="410" y="420" fill="#cbd5e1" font-size="11">[PASSED] A709_02: ARINC 429 Bit 32 Odd Parity Rule on Distance &amp; Tuning Words</text>
  <text x="410" y="445" fill="#cbd5e1" font-size="11">[PASSED] A709_03: Radar Mile Propagation Delay Precision (12.3592 µs/NM)</text>
  <text x="410" y="470" fill="#cbd5e1" font-size="11">[PASSED] A709_04: ICAO Annex 10 Channel Pairing &amp; Reply Delays (X: 50µs / Y: 56µs)</text>
  <text x="410" y="495" fill="#cbd5e1" font-size="11">[PASSED] A709_05: Multi-Channel Scanning DME Architecture (5 Active Channels)</text>
  <text x="410" y="520" fill="#cbd5e1" font-size="11">[PASSED] A709_06: Slant Range to Ground Range Pythagorean Geometry Precision</text>
  <text x="410" y="545" fill="#cbd5e1" font-size="11">[PASSED] A709_07: PRF Mode Switching Logic (Search 150 pps vs Track 25 pps)</text>
</svg>